name: Generate Snake Animation

# Genera la animación de la serpiente que "se come" tu grid de contribuciones.
# Publica los SVG (dark/light) en la rama `output`, que el README referencia por raw URL.

on:
  schedule:
    - cron: "0 */12 * * *" # cada 12 horas
  workflow_dispatch: # permite ejecutarlo manualmente
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        # Recomendado: fijar a un SHA en vez de @v3 para máxima seguridad de supply-chain.
        uses: Platane/snk@v3
        id: snake-gen
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
