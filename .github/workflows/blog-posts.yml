name: Latest Blog Posts

# Trae tus últimos posts desde un feed RSS y los inyecta en el README
# entre los markers <!-- BLOG-POST-LIST:START --> y <!-- BLOG-POST-LIST:END -->.
# El resultado queda como markdown estático (no depende de hotlinks en runtime).

on:
  schedule:
    - cron: "0 */6 * * *" # cada 6 horas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull latest blog posts
        uses: gautamkrishnar/blog-post-workflow@v1.9.0
        with:
          # TODO: reemplaza con la URL REAL del feed RSS de tu blog.
          # Ejemplos: https://dev.to/feed/tuusuario  |  https://tublog.hashnode.dev/rss.xml  |  https://sandovaldavid.com/rss.xml
          feed_list: "https://sandovaldavid.com/rss.xml"
          max_post_count: 5
          comment_tag_name: "BLOG-POST-LIST"
